name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.3.11', '1.4.4']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run check
      - name: Test
        run: bun test
      - name: Contract
        run: bun cli/index.ts contract check
      - name: Examples
        run: |
          for example in basic minimal legacy; do
            bun cli/index.ts validate "examples/$example"
            bun cli/index.ts check "examples/$example"
            bun cli/index.ts build "examples/$example" --local-paths --out "$RUNNER_TEMP/build/$example"
          done
